manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: eerieleap
      url-base: https://github.com/EerieLeap

  projects:
    - name: eerie_leap_lua
      remote: eerieleap
      repo-path: zephyr_lua
      revision: main
      path: modules/eerie_leap_lua

    - name: zephyr
      remote: zephyrproject-rtos
      revision: main
      import:
        # Only the modules the test suites actually pull in are cloned.
        name-allowlist:
          - cmsis           # required by the ARM port
          - cmsis_6         # required by the ARM port
          - zcbor           # CBOR light JSON like data format
          - fatfs           # FATFS filesystem
          - littlefs        # littleFS lightweight filesystem

  self:
    path: rt_core
