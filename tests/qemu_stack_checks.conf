# Work queue stacks come from the heap (k_thread_stack_alloc) and only
# qemu_riscv64 puts a guard below them, so on the other targets an overflow
# corrupts the neighbouring heap chunk and surfaces later as an unrelated heap
# assertion. The sentinel names the thread on its next switch or interrupt
# exit instead. It catches overflows that write the lowest word of the stack;
# a frame that jumps past it still goes unnoticed.
CONFIG_STACK_SENTINEL=y
