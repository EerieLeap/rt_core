CONFIG_ZTEST=y

# Language and Compiler
CONFIG_CPP=y
CONFIG_PICOLIBC=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=200000

# C++ exception unwinding needs considerably more stack than the ztest defaults.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192

# Logging And Debugging
CONFIG_LOG=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_THREAD_NAME=y

# ThreadBase::InitializeStack() falls back to k_thread_stack_alloc().
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y

# The image slots: native_sim's flash simulator with the partitions of boards/native_sim.overlay. MCUboot
# itself and its swap mode are set by the scenarios (testcase.yaml).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_EERIE_LEAP_RT_CORE=y
CONFIG_EERIE_LEAP_SMP=y
CONFIG_EERIE_LEAP_DFU=y

# The image signing step and DfuController need the unit's product ID (CMakeLists.txt signs the test images
# for the same one).
CONFIG_EERIE_LEAP_CONFIGURATION=y
CONFIG_EERIE_LEAP_DOMAIN_SYSTEM=y
CONFIG_EERIE_LEAP_PRODUCT_ID=4660

# DfuController's timing, short for the tests that run it for real: it ticks every quarter of the
# watchdog timeout (native_sim has no watchdog0, so only the tick uses it).
CONFIG_EERIE_LEAP_DFU_CONFIRM_DELAY_MS=300
CONFIG_EERIE_LEAP_DFU_WATCHDOG_TIMEOUT_MS=400
