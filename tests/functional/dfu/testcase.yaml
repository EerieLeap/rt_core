common:
  tags:
    - functional
    - dfu
  # Image management runs on native_sim's flash simulator, with the slots of boards/native_sim.overlay.
  platform_allow:
    - native_sim

tests:
  # MCUboot's swap-using-move mode, which the hardware boards use (Espressif's default): the secondary
  # slot's image starts at its first sector.
  functional.dfu:
    extra_configs:
      - CONFIG_BOOTLOADER_MCUBOOT=y
      - CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_MOVE=y
  # Swap-using-offset, Zephyr's default mode: the secondary slot's image starts one sector in, which is
  # where the header sector of a refused upload is.
  functional.dfu.swap_offset:
    extra_configs:
      - CONFIG_BOOTLOADER_MCUBOOT=y
      - CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_OFFSET=y
  # No MCUboot in the configuration, as the rt_core test builds of other suites have it: the image
  # manager and img_mgmt run on the flash simulator, without a swap mode.
  functional.dfu.no_bootloader: {}
  # The bench fault that never reports boot complete: an unconfirmed image does not confirm itself.
  functional.dfu.bench_no_report:
    extra_configs:
      - CONFIG_BOOTLOADER_MCUBOOT=y
      - CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_MOVE=y
      - CONFIG_EERIE_LEAP_DFU_BENCH_FAULT_NO_REPORT=y
