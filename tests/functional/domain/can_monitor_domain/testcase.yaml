common:
  tags:
    - functional
    - domain.can_monitor
  platform_allow:
    - native_sim
    - qemu_cortex_a9
    - qemu_cortex_a53
    - qemu_riscv64
    - qemu_malta
  # The suites wait on real seconds under QEMU: statistics every second, a synthetic rate over several.
  timeout: 300

tests:
  functional.can_monitor_domain: {}
  # A build without transmit: ARM, SEND, PERIODIC and REPLAY answer TX_UNSUPPORTED.
  functional.can_monitor_domain.no_tx:
    extra_args:
      - RT_CORE_NO_TX=y
    extra_configs:
      - CONFIG_EERIE_LEAP_CAN_MONITOR_TX=n
