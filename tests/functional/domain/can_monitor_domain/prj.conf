CONFIG_ZTEST=y

# Language and Compiler
CONFIG_CPP=y
CONFIG_PICOLIBC=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y

# Memory: two rings, the notifications the fake keeps, and the threads' stacks.
CONFIG_HEAP_MEM_POOL_SIZE=200000

# C++ exception unwinding needs considerably more stack than the ztest defaults.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192

# Logging And Debugging
CONFIG_LOG=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_THREAD_NAME=y

# ThreadBase::InitializeStack() falls back to k_thread_stack_alloc() for the CAN, sender and source threads.
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y

# FS Config
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y

CONFIG_ZCBOR=y

CONFIG_CRC=y

# CANBus: the tap's two accept-all filters and a consumer's, on each of the two controllers.
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
CONFIG_CAN_LOOPBACK=y
CONFIG_CAN_LOOPBACK_MAX_FILTERS=16
CONFIG_CAN_ACCEPT_RTR=y

# The 512 byte default overflows on the 64-bit QEMU targets.
CONFIG_CAN_LOOPBACK_TX_THREAD_STACK_SIZE=2048

CONFIG_EERIE_LEAP_RT_CORE=y
CONFIG_EERIE_LEAP_CONFIGURATION=y
CONFIG_EERIE_LEAP_CANBUS=y
CONFIG_EERIE_LEAP_DEVICE_TREE=y
CONFIG_EERIE_LEAP_FS=y
CONFIG_EERIE_LEAP_LUA_SCRIPT=y
CONFIG_EERIE_LEAP_EXPRESSION_ENGINE=y
CONFIG_EERIE_LEAP_RANDOM=y
CONFIG_EERIE_LEAP_THREADING=y
CONFIG_EERIE_LEAP_SMP=y

CONFIG_EERIE_LEAP_DOMAIN_CANBUS=y
CONFIG_EERIE_LEAP_DOMAIN_SCRIPT=y
CONFIG_EERIE_LEAP_DOMAIN_CAN_MONITOR=y

# A small ring, so that a stalled link overflows it quickly.
CONFIG_EERIE_LEAP_CAN_MONITOR_RING_SIZE=16384
CONFIG_EERIE_LEAP_CAN_MONITOR_SYNTHETIC=y

# The sender catches and throws; the unwinder needs a DWARF-sized stack on the 64-bit and MIPS targets.
CONFIG_EERIE_LEAP_CAN_MONITOR_SENDER_STACK_SIZE=10240

# OPEN allocates the ring, sets the tap and builds the session on the MCUmgr work queue; with the unwinder's frames
# on the 64-bit and MIPS targets that is more than the default 2 KiB.
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=8192

# Changed-bytes records, which OPEN's `delta` asks for.
CONFIG_EERIE_LEAP_CAN_MONITOR_DELTA=y

# A lapsed lease ends the session. The suite's longer tests renew it (Harness::Sleep()); the lease tests wait it out.
CONFIG_EERIE_LEAP_CAN_MONITOR_LEASE_MS=4000

# Ends the sessions of a lapsed lease and of a lost connection, stopping the buses they own.
CONFIG_EERIE_LEAP_CAN_MONITOR_WORK_QUEUE_STACK_SIZE=6144

# A bus of its own that detects its bitrate sleeps this long between rounds; closing the session waits for it.
CONFIG_EERIE_LEAP_CANBUS_AUTO_DETECT_INTERVAL_MS=300
