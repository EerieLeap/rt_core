common:
  tags:
    - functional
    - domain.logging_control
  # The configuration-update cases run the real pipeline, and QEMU runs in real time: the remote
  # scenario alone took 62 s on qemu_cortex_a9 and a53 with the first 17 of them, past the default of
  # 60 s. The time of the full set has not been measured on QEMU; measure it on a53 and a9 and set
  # this to about twice that.
  timeout: 180
  platform_allow:
    - native_sim
    - qemu_cortex_a9
    - qemu_cortex_a53
    - qemu_riscv64
    - qemu_malta

tests:
  # The remote role, as the gauge builds it: logging_controller_remote.cpp and
  # logging_controller_remote_updates.cpp.
  functional.logging_control: {}
  # The suite with a raised CDMP work queue stack, for the restart monitor's throwing handler case:
  # it unwinds on that queue, which overflowed the 4096 B default on the 64 bit QEMU targets and on
  # MIPS. Below 8192 the case runs only on native_sim, which does not enforce thread stacks.
  functional.logging_control.raised_cdmp_stack:
    platform_exclude:
      - native_sim
    extra_configs:
      - CONFIG_EERIE_LEAP_CDMP_WORK_QUEUE_STACK_SIZE=8192
  # The writer role, as rt_daq builds it: the logging domain next to the controller, so rt_core's
  # CMakeLists.txt globs control/ twice and de-duplicates it. logging_controller_writer.cpp and
  # logging_controller_writer_updates.cpp replace the two remote files, and the other cases run
  # where the domain and the controller both build control/. The log volume is the 1 MiB test
  # filesystem, below the 16 MiB default minimum. This scenario has the assets registry, which the
  # writer registers the log files with (the LOGS cases of logging_controller_writer.cpp); the others
  # build the controller without it.
  functional.logging_control.writer_role:
    extra_configs:
      - CONFIG_EERIE_LEAP_ASSETS=y
      - CONFIG_EERIE_LEAP_DOMAIN_LOGGING=y
      - CONFIG_EERIE_LEAP_LOG_MIN_FREE_SPACE_MB=0
      - CONFIG_EERIE_LEAP_MDF=y
      - CONFIG_EERIE_LEAP_PRODUCT_ID=50178
      - CONFIG_EERIE_LEAP_HW_VERSION_MAJOR=2
      - CONFIG_EERIE_LEAP_HW_VERSION_MINOR=1
      - CONFIG_EERIE_LEAP_SW_VERSION_MAJOR=1
      - CONFIG_EERIE_LEAP_SW_VERSION_MINOR=2
      - CONFIG_EERIE_LEAP_SW_VERSION_PATCH=3
      - CONFIG_TIMING_FUNCTIONS=y
