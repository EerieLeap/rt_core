common:
  tags:
    - functional
    - subsys.fs
  platform_allow:
    - native_sim
    - qemu_cortex_a9
    - qemu_cortex_a53
    - qemu_riscv64
    - qemu_malta

tests:
  functional.subsys.fs: {}
  # The unbuffered write path of FsServiceStreamBuf (test_unbuffered_when_the_buffer_size_is_zero
  # and the older write tests); the put-area tests skip here.
  functional.subsys.fs.unbuffered:
    # A Kconfig filter would be evaluated without rt_core_test.cmake's modules, so the boards
    # the common list allows are excluded instead.
    platform_exclude:
      - qemu_cortex_a9
      - qemu_cortex_a53
      - qemu_riscv64
      - qemu_malta
    extra_configs:
      - CONFIG_EERIE_LEAP_FS_STREAM_WRITE_BUFFER_SIZE=0
