CONFIG_ZTEST=y

# Language and Compiler
CONFIG_CPP=y
CONFIG_PICOLIBC=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y

# Memory (the Bluetooth stack allocates from the kernel heap)
CONFIG_HEAP_MEM_POOL_SIZE=65536

# C++ exception unwinding needs considerably more stack than the ztest defaults.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192

# Logging And Debugging
CONFIG_LOG=y
CONFIG_THREAD_NAME=y

# Bluetooth, linked but never enabled: the tests read the static GATT table. native_sim's devicetree
# selects the HCI user channel driver.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# ble.cpp asserts a single connection
CONFIG_BT_MAX_CONN=1
# ble.cpp sets bt_conn_cb.security_changed
CONFIG_BT_SMP=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

CONFIG_EERIE_LEAP_RT_CORE=y
CONFIG_EERIE_LEAP_BLUETOOTH=y
