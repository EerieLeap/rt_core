CONFIG_ZTEST=y

# Language and Compiler
CONFIG_CPP=y
CONFIG_PICOLIBC=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=200000

# C++ exception unwinding needs considerably more stack than the ztest defaults.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192

# Logging And Debugging
CONFIG_LOG=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_THREAD_NAME=y

# ThreadBase::InitializeStack() falls back to k_thread_stack_alloc().
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y

CONFIG_EERIE_LEAP_RT_CORE=y
CONFIG_EERIE_LEAP_CONFIGURATION=y
CONFIG_EERIE_LEAP_DOMAIN_SYSTEM=y
CONFIG_EERIE_LEAP_SMP=y
CONFIG_EERIE_LEAP_CONTROLLER_MANAGEMENT=y

CONFIG_EERIE_LEAP_SMP_CONFIG_SESSION_TIMEOUT_MS=300
# More than one response holds, to exercise paging.
CONFIG_EERIE_LEAP_SMP_NETWORK_MAX_DEVICES=64

# Product and versions reported by the device group.
CONFIG_EERIE_LEAP_PRODUCT_FAMILY_DISPLAY_MODULE=y
CONFIG_EERIE_LEAP_PRODUCT_ID=4660
CONFIG_EERIE_LEAP_REVISION=3
CONFIG_EERIE_LEAP_FEATURES_CANBUS=y
CONFIG_EERIE_LEAP_HW_VERSION_MAJOR=1
CONFIG_EERIE_LEAP_HW_VERSION_MINOR=2
CONFIG_EERIE_LEAP_HW_VERSION_PATCH=3
CONFIG_EERIE_LEAP_SW_VERSION_MAJOR=4
CONFIG_EERIE_LEAP_SW_VERSION_MINOR=5
CONFIG_EERIE_LEAP_SW_VERSION_PATCH=6
