common:
  tags:
    - functional
    - subsys.smp
  platform_allow:
    - native_sim
    - qemu_cortex_a9
    - qemu_cortex_a53
    - qemu_riscv64
    - qemu_malta

tests:
  functional.smp_groups: {}
  # A unit with management and assets that serves no assets group, as rt_daq builds today.
  functional.smp_groups.no_assets:
    extra_configs:
      - CONFIG_EERIE_LEAP_SMP_ASSETS=n
