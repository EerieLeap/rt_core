# This scenario only exists so that clang-tidy sees the Bluetooth stack (plan D7): the native_sim
# compile database it produces contains ble.cpp, access_point_service.cpp, ble_service.cpp and
# ble_controller.cpp, which no other native_sim suite builds. It is build only and never run.

# Language and Compiler
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y

# Memory (the Bluetooth stack allocates from the kernel heap)
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Logging And Debugging
CONFIG_LOG=y
CONFIG_THREAD_NAME=y

# Bluetooth (native_sim's devicetree already selects the HCI user channel driver)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# ble.cpp asserts a single connection
CONFIG_BT_MAX_CONN=1
# ble.cpp sets bt_conn_cb.security_changed
CONFIG_BT_SMP=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# The BLE domain reads sensors and the system state, which pull in the rest of this list
CONFIG_ADC=y
CONFIG_CAN=y
CONFIG_ZCBOR=y

CONFIG_EERIE_LEAP_RT_CORE=y
CONFIG_EERIE_LEAP_THREADING=y
CONFIG_EERIE_LEAP_CONFIGURATION=y
CONFIG_EERIE_LEAP_ADC=y
CONFIG_EERIE_LEAP_CANBUS=y
CONFIG_EERIE_LEAP_EXPRESSION_ENGINE=y
CONFIG_EERIE_LEAP_LUA_SCRIPT=y
CONFIG_EERIE_LEAP_BLUETOOTH=y
CONFIG_EERIE_LEAP_DOMAIN_SENSOR=y
CONFIG_EERIE_LEAP_DOMAIN_SYSTEM=y
CONFIG_EERIE_LEAP_DOMAIN_BLE=y
CONFIG_EERIE_LEAP_CONTROLLER_BLE=y
